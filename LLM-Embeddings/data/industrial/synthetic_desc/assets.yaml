industrial_assets:
  rotating_equipment:
    description: "Equipment that involves rotating components used for mechanical energy conversion or transmission."
    assets:
      - Electric motor: "Converts electrical energy into mechanical energy to power various industrial machinery."
      - Steam turbine: "A rotary machine that extracts energy from steam and converts it into mechanical work."
      - Aero gas turbine: "A type of gas turbine optimized for aircraft engines, used for generating thrust."
      - Industrial gas turbine: "A gas turbine used in industrial applications to generate mechanical energy for power generation or mechanical drives."
      - Centrifugal pump: "A pump that uses a rotating impeller to add velocity to the fluid, often used in water and chemical transfer."
      - Axial compressor: "A compressor that uses rotating blades to compress air, typically used in turbines."
      - Screw compressor: "A type of positive displacement compressor using two intermeshing screws to compress air."
      - Centrifugal compressor: "Uses a rotating impeller to increase the pressure of a gas by converting kinetic energy into potential energy"
      - Blower: "A machine used to create a flow of air or gas, typically for ventilation or industrial applications."
      - Hydraulic pump: "A device that converts mechanical energy into hydraulic energy, used in fluid power systems."
      - Wind turbine: "A device that converts wind energy into mechanical energy for electricity generation."
      - Reciprocating internal combustion: "An engine that converts chemical energy from fuel into mechanical energy through piston movement."
      - Coupling: "A device used to connect two rotating shafts, enabling power transmission."
      - Gearbox: "A mechanical device used to alter the speed and torque of rotational energy from a motor."
      - Agitator: "A device used to stir or mix substances, commonly used in chemical or food processing."
      - Rolling mill: "A machine used for shaping metal by passing it through a set of rolls, typically used in metalworking industries."
      - Centrifugal fan: " A mechanical device used to move air by increasing the velocity of air or gas that passes through it using centrifugal force"
  
  heat_transfer_equipment:
    description: "Equipment designed to transfer heat between fluids or air, widely used in HVAC, power, and process industries."
    assets:
      - Shell-and-tube heat exchanger: "A heat exchanger consisting of a series of tubes, where one fluid runs through the tubes and another flows around them."
      - Plate heat exchanger: "A type of heat exchanger consisting of multiple thin plates stacked together, used for heat transfer between liquids."
      - Air-cooled heat exchanger: "Uses air to cool fluids circulating in a system, typically in large power plants."
      - Cooling tower: "A structure that removes heat from water-cooled systems by evaporating water to cool the circulating fluid."
      - Boiler (fire-tube): "A type of boiler where hot gases pass through tubes submerged in water to heat it."
      - Boiler (water-tube): "A boiler in which water flows through tubes that are heated by surrounding combustion gases."
      - Furnace: "A high-temperature device used for heating materials or fluids in various industrial processes."
      - Steam condenser: "A device used in power plants to condense exhaust steam from a turbine into water for reuse."
      - Radiator: "A device for transferring heat from a fluid to the surrounding environment, typically used in cooling systems."
      - Oil cooler: "A heat exchanger used to cool the oil in engines, hydraulics, or gear systems."
      - Evaporator: "A device that removes heat from a refrigerant, causing it to evaporate and absorb heat."
      - Reboiler: "A heat exchanger used in distillation columns to supply the necessary heat for boiling."
      - Chiller: "A system used to cool water or air, commonly used in HVAC systems or industrial cooling."

  electrical_equipment:
    description: "Electrical equipment used for power generation, distribution, and control in various industrial applications."
    assets:
      - Power transformer: "A device used to transfer electrical energy between two or more circuits through electromagnetic induction."
      - Circuit breaker: "An automatic switch that disconnects an electrical circuit to prevent overload or short circuits."
      - Switchgear: "A combination of electrical disconnect switches, fuses, and circuit breakers used to control, protect, and isolate electrical equipment."
      - Voltage regulator: "A device that maintains a constant voltage level in electrical circuits to prevent fluctuations."
      - Distribution transformer: "A transformer used to step down voltage levels for local power distribution."
      - Electric heater: "A device that uses electrical energy to generate heat for heating applications."
      - Battery energy storage system: "A system used to store electrical energy, often used for load balancing and backup power."
      - Electric arc furnace: "A furnace that uses an electric arc to melt materials, commonly used in steelmaking."
      - Uninterruptible Power Supply (UPS): "A backup power system that provides emergency power during electrical outages."
      - Motor control center (MCC): "A centralized system for controlling motors and other electrical devices in industrial settings."
      - Alternator: "A machine that converts mechanical energy into electrical energy, typically used in power generation."
      - Static synchronous compensator (STATCOM): "A device used to regulate voltage and improve the stability of electrical grids."
      - Variable frequency drive (VFD): "A device that controls the speed and torque of an electric motor by varying the frequency of the electrical supply."
      - Standby generator: "A backup power generator used when the main power source fails."
      - Diesel generator: "A generator that uses diesel fuel to produce electricity, often used as backup power."
      - Electric generator: "a device that converts mechanical energy into electrical energy through the process of electromagnetic induction"

  data_center_specific_equipment:
    description: "Critical equipment in data centers designed to support infrastructure, cooling, and power systems."
    assets:
      - Chiller: "Cooling systems used to maintain a controlled temperature in data centers."
      - Air handling unit (AHU): "A device used to condition and circulate air as part of an HVAC system."
      - Precision air conditioning unit (PACU): "A specialized cooling unit designed for cooling sensitive equipment in data centers."
      - Computer room air handler (CRAH): "A type of air handler used in data centers to maintain temperature and humidity levels."
      - Computer room air conditioning (CRAC): "A system designed to maintain cooling in computer rooms and data centers."
      - Rack-mounted cooling systems: "Cooling units designed to be installed directly in server racks to ensure temperature control."
      - Energy recovery ventilator (ERV): "A system that exchanges heat and moisture between incoming and outgoing air to improve energy efficiency."
      - Humidifier: "A device used to maintain humidity levels within a controlled range in data centers."
      - Dehumidifier: "A device that reduces the humidity in the air, preventing condensation in data centers."
      - Raised floor cooling systems: "Cooling systems integrated into raised floor designs, typically used in data centers to improve air circulation."

  material_handling_equipment:
    description: "Equipment used for moving, lifting, and managing materials in various industrial environments."
    assets:
      - Conveyor belt system: "A system of belts used to transport materials or products in industrial settings."
      - Bucket elevator: "A vertical conveyor used for lifting bulk materials."
      - Screw conveyor: "A conveyor that uses a rotating screw to move materials along a trough."
      - Crane: "A machine used for lifting and moving heavy loads in manufacturing and construction."
      - Hoist: "A device for lifting or lowering a load using a drum or lift wheel."
      - Forklift: "A powered industrial truck used to lift and move materials over short distances."
      - Automated guided vehicle (AGV): "A self-driving vehicle used in industrial environments for material transport."
      - Stacker-reclaimer: "A machine used to stack and reclaim bulk materials from a pile or storage area."
      - Overhead conveyor system: "A conveyor system mounted above the ground to transport materials, often used in factories."
      - Gantry crane: "A large crane that moves along tracks to lift and move materials, often used in shipyards or large warehouses."
      - Roller conveyor: "A conveyor with a series of rollers that move materials along a flat surface."
      - Vibratory feeder: "A device that uses vibration to move bulk materials along a controlled path."
      
  process_equipment:
    description: "Equipment designed for various chemical, mechanical, or physical processing in industrial applications."
    assets:
      - Reactor vessel: "A vessel used for chemical reactions in industries such as pharmaceuticals or petrochemicals."
      - Distillation column: "A tower used for separating mixtures based on the different boiling points of components."
      - Absorber tower: "A column used for absorbing gases or other substances in industrial processes."
      - Scrubber system: "A system used to remove pollutants from industrial exhaust gases."
      - Separator: "A device used for separating liquids, solids, or gases from each other in various processes."
      - Centrifuge: "A machine used for separating particles from liquids using centrifugal force."
      - Mixer: "A machine used to blend materials together in industries such as food, pharmaceuticals, and chemicals."
      - Bag filter: "A filtration device used to remove particulates from gases or liquids."
      - Cyclone separator: "A device that separates particles from gases using centrifugal force."
      - Rotary kiln: "A large cylindrical furnace used for heating materials to high temperatures in industrial processes."
      - Pulverizer: "A machine used for grinding materials into a fine powder."
      - Dryer: "A machine used for removing moisture from materials, often used in food or chemical processing."

  fluid_handling_equipment:
    description: "Equipment used for managing, controlling, and transporting fluids, essential in various industrial processes."
    assets:
      - Pressure relief valve: "A valve that prevents overpressure in a system by releasing pressure when necessary."
      - Control valve: "A valve used to control the flow of fluids within a system, often adjusted automatically."
      - Flow meter: "A device used to measure the flow rate of fluids in pipes."
      - Hydraulic actuator: "A device that uses hydraulic fluid to create motion in machinery or systems."
      - Pneumatic actuator: "A device that uses compressed air to create motion."
      - Vapor recovery unit (VRU): "A system used to recover vaporized fuel or chemicals from exhaust systems."
      - Pipeline: "A series of pipes used to transport fluids over long distances."
      - Storage tank: "A large container used to store liquids or gases for industrial purposes."
      - Diaphragm pump: "A pump that uses a diaphragm to move fluid, often used for high-viscosity liquids."
      - Submersible pump: "A pump designed to operate underwater, commonly used in sewage or groundwater pumping."
      - Positive displacement pump: "A pump that moves a fixed amount of fluid per cycle, often used in precise fluid handling."
      - Vacuum pump: "A pump that removes gas molecules from a sealed volume to create a vacuum."

  instrumentation_and_controls:
    description: "Devices and systems used to measure, control, and automate industrial processes."
    assets:
      - Pressure transmitter: "A sensor used to measure pressure and convert it into an electrical signal."
      - Temperature transmitter: "A device that measures temperature and transmits the data to control systems."
      - Level sensor: "A sensor that detects the level of a material or fluid in a container."
      - Vibration monitor: "A system used to detect vibrations in equipment, often used for predictive maintenance."
      - Flow controller: "A device used to regulate the flow of fluids or gases in a system."
      - Gas detector: "A device that detects the presence of specific gases in the air, often used for safety."
      - Flame detector: "A sensor used to detect the presence of a flame in industrial processes."
      - Programmable Logic Controller (PLC): "A digital computer used for automation of industrial processes."
      - Distributed Control System (DCS): "A control system used for monitoring and controlling large-scale industrial processes."
      - Human-Machine Interface (HMI): "A user interface that allows humans to interact with machines or control systems."
      - Data acquisition system (DAQ): "A system that collects and analyzes data from industrial equipment."
      - SCADA system: "A supervisory control and data acquisition system used for monitoring and controlling industrial processes remotely."
      
  renewable_energy_assets:
    description: "Assets used for generating renewable energy, reducing dependency on non-renewable sources."
    assets:
      - Solar photovoltaic panel: "A device that converts sunlight directly into electricity using semiconductor materials."
      - Solar inverter: "A device that converts DC electricity generated by solar panels into AC electricity."
      - Solar thermal collector: "A device used to collect heat from the sun, typically used for water heating or space heating."
      - Biogas plant digester: "A vessel used to break down organic material in the absence of oxygen to produce biogas."
      - Biomass boiler: "A boiler that uses organic materials like wood pellets or agricultural waste for heat generation."
      - Hydroelectric generator: "A power generator that uses the energy from flowing water to produce electricity."
      - Tidal turbine: "A turbine that generates electricity from the movement of tidal waters."
      - Geothermal heat pump: "A system that uses the Earth's natural heat to provide heating and cooling."
      - Flywheel energy storage: "A system that stores energy in the form of rotational kinetic energy."
      - Energy management system: "A system used to optimize energy use in industrial and commercial environments."
      
  specialized_machinery:
    description: "Specialized equipment used in manufacturing, fabrication, and processing industries."
    assets:
      - CNC machine: "A computer-controlled machine used for precisely cutting, drilling, or milling materials."
      - Injection molding machine: "A machine used to produce parts by injecting molten material into a mold."
      - Extrusion press: "A machine used to force material through a die to create continuous shapes."
      - Welding robot: "An automated robot used for welding operations in manufacturing."
      - Laser cutting machine: "A machine that uses a laser to cut materials with high precision."
      - Water jet cutting system: "A system that uses high-pressure water mixed with abrasives to cut materials."
      - Grinding machine: "A machine used for grinding materials, typically for precision shaping or finishing."
      - Printing press: "A machine used for mass production of printed materials, such as newspapers or books."
      - Textile spinning machine: "A machine used in the textile industry to spin fibers into yarn."
      - Food processing conveyor: "A conveyor system used for moving food products through various stages of processing."
      - Packaging machine: "A machine used for packing products into containers or packages."
      - Belt dryer: "A dryer system that uses a continuous belt to process materials by drying."
